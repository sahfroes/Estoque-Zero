<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Faz a tela se adaptar ao celular -->
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrinho - Estoque Zero</title>

    <!-- CSS do carrinho -->
    <link 
        rel="stylesheet" 
        href="../../CSS/carrinho.css"
    >

</head>


<body>


    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header class="cabecalho">

        <!-- Botão voltar -->
        <button 
            id="botao-voltar"
            class="botao-voltar"
        >
            ←
        </button>


        <!-- Título -->
        <h1>
            Carrinho
        </h1>

    </header>



    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <main class="conteudo">


        <!-- ==========================================
             LISTA DE PRODUTOS
        =========================================== -->

        <section 
            id="lista-produtos"
            class="lista-produtos"
        >

            <!-- Os produtos serão colocados
                 aqui pelo JavaScript -->

        </section>



        <!-- ==========================================
             MENSAGEM CARRINHO VAZIO
        =========================================== -->

        <div 
            id="carrinho-vazio"
            class="carrinho-vazio"
        >

            <div class="icone-vazio">
                🛒
            </div>

            <h2>
                Seu carrinho está vazio
            </h2>

            <p>
                Escaneie um produto para adicioná-lo.
            </p>

            <button 
                id="voltar-camera-vazio"
                class="botao-voltar-camera"
            >
                Voltar para câmera
            </button>

        </div>



        <!-- ==========================================
             RESUMO DA COMPRA
        =========================================== -->

        <section 
            id="resumo"
            class="resumo"
        >


            <!-- Orçamento inicial -->

            <div class="linha-resumo">

                <span>
                    Orçamento inicial
                </span>

                <strong id="orcamento-inicial">
                    R$ 0,00
                </strong>

            </div>



            <!-- Total gasto -->

            <div class="linha-resumo">

                <span>
                    Total gasto
                </span>

                <strong 
                    id="total-gasto"
                    class="total-gasto"
                >
                    R$ 0,00
                </strong>

            </div>



            <!-- Saldo restante -->

            <div class="linha-resumo">

                <span>
                    Saldo restante
                </span>

                <strong 
                    id="saldo-restante"
                    class="saldo-restante"
                >
                    R$ 0,00
                </strong>

            </div>



            <!-- Linha separadora -->

            <div class="linha"></div>



            <!-- Confirmar compras -->

            <button 
                id="confirmar-compras"
                class="botao-confirmar"
            >

                ✓

                <span>
                    Confirmar compras
                </span>

            </button>


        </section>


    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../../JS/carrinho.js"></script>

</body>

</html>
