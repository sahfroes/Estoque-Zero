<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Estoque Zero - Ranking</title>

    <link
        rel="stylesheet"
        href="../../CSS/ranking.css"
    >

</head>


<body>

    <main class="app">


        <!-- =========================
             TOPO
        ========================== -->

        <header class="topo">

            <button
                class="botao-voltar"
                onclick="voltarResultado()"
            >
                ←
            </button>


            <div class="logo">

                ESTOQUE

                <span>ZERO</span>

            </div>

        </header>



        <!-- =========================
             TÍTULO
        ========================== -->

        <section class="cabecalho-ranking">

            <div class="trofeu">
                🏆
            </div>

            <h1>
                Ranking
            </h1>

            <p id="mensagemRanking">
                Carregando participantes...
            </p>

        </section>



        <!-- =========================
             PÓDIO
        ========================== -->

        <section
            class="podio"
            id="podio"
        >

            <div
                id="segundoLugar"
                class="jogador segundo"
            >
            </div>


            <div
                id="primeiroLugar"
                class="jogador primeiro"
            >
            </div>


            <div
                id="terceiroLugar"
                class="jogador terceiro"
            >
            </div>

        </section>



        <!-- =========================
             LISTA
        ========================== -->

        <section class="lista-ranking">

            <h2>
                Classificação
            </h2>


            <div id="listaRanking">

                <p style="text-align:center;">
                    Carregando...
                </p>

            </div>

        </section>



        <!-- =========================
             MINHA POSIÇÃO
        ========================== -->

        <section class="minha-posicao">

            <div>

                <small>
                    Sua posição
                </small>

                <strong id="minhaPosicao">
                    --
                </strong>

            </div>


            <div class="minha-pontuacao">

                <span id="minhaPontuacao">
                    0
                </span>

                <small>
                    pontos
                </small>

            </div>

        </section>



        <!-- =========================
             BOTÃO
        ========================== -->

        <button
            class="botao-principal"
            onclick="voltarInicio()"
        >

            Voltar para o início

        </button>



        <!-- =========================
             MENU
        ========================== -->

        <nav class="menu">

            <button
                class="menu-item"
                onclick="voltarInicio()"
            >

                <span>
                    ⌂
                </span>

                Início

            </button>


            <button
                class="menu-item ativo"
            >

                <span>
                    🏆
                </span>

                Ranking

            </button>


            <button
                class="menu-item"
            >

                <span>
                    👤
                </span>

                Perfil

            </button>

        </nav>


    </main>

    <script src="../../Js/ranking.js"></script>

</body>

</html>
