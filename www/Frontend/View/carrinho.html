<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Carrinho - Estoque Zero</title>

    <link
        rel="stylesheet"
        href="../../CSS/carrinho.css"
    >

</head>

<body>

    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header class="cabecalho">

        <button
            type="button"
            id="botao-voltar"
            class="botao-voltar"
            aria-label="Voltar para a câmera"
        >
            ←
        </button>

        <h1>
            Carrinho
        </h1>

    </header>
    <!-- ==========================================
         CONTEÚDO
    =========================================== -->

    <main class="conteudo">

        <!-- ==========================================
             LISTA DE PRODUTOS
        =========================================== -->

        <section
            id="lista-produtos"
            class="lista-produtos"
        >
        </section>

        <!-- ==========================================
             CARRINHO VAZIO
        =========================================== -->

        <div
            id="carrinho-vazio"
            class="carrinho-vazio"
        >

            <div class="icone-vazio">
                🛒
            </div>

            <h2>
                Seu carrinho está vazio
            </h2>

            <p>
                Escaneie um produto para adicioná-lo.
            </p>

            <button
                type="button"
                id="voltar-camera-vazio"
                class="botao-voltar-camera"
            >
                Voltar para câmera
            </button>

        </div>

        <!-- ==========================================
             RESUMO
        =========================================== -->

        <section
            id="resumo"
            class="resumo"
        >

            <div class="linha-resumo">

                <span>
                    Orçamento inicial
                </span>

                <strong id="orcamento-inicial">
                    R$ 0,00
                </strong>

            </div>

            <div class="linha-resumo">

                <span>
                    Total gasto
                </span>

                <strong
                    id="total-gasto"
                    class="total-gasto"
                >
                    R$ 0,00
                </strong>

            </div>

            <div class="linha-resumo">

                <span>
                    Saldo restante
                </span>

                <strong
                    id="saldo-restante"
                    class="saldo-restante"
                >
                    R$ 0,00
                </strong>

            </div>

            <div class="linha"></div>

            <!-- ==========================================
                 FINALIZAR PARTIDA
            =========================================== -->

            <button
                type="button"
                id="confirmar-compras"
                class="botao-confirmar"
            >

                <span class="icone-confirmar">
                    ✓
                </span>

                <span>
                    Finalizar partida
                </span>

            </button>

        </section>

    </main>

    <script src="../../JS/carrinho.js"></script>
    <script src="../../JS/cronometro.js"></script>

</body>

</html>
