<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover,
                 maximum-scale=1.0,
                 user-scalable=no">

    <title>Estoque Zero - Câmera</title>


    <!-- ==========================================
         A-FRAME
    =========================================== -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- ==========================================
         A-FRAME EXTRAS
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>


    <!-- ==========================================
         MINDAR
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- ==========================================
         CSS
    =========================================== -->

    <link
        rel="stylesheet"
        href="../../CSS/camera.css">

</head>


<body>


<main class="tela-camera">

    <!-- ==========================================
         MENSAGEM SOBRE O PRODUTO
    =========================================== -->

    <div
        id="toque-produto"
        class="toque-produto">

        <span>
            Toque no produto
        </span>

    </div>


    <!-- ==========================================
         CENA AR
    =========================================== -->

    <a-scene

        id="cena-ra"

        class="cena-ra"

        mindar-image="
            imageTargetSrc: ../../img/targets/targets.mind;
            autoStart: true;
            uiScanning: no;
            uiLoading: no;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="
            enabled: false
        ">


        <!-- ==========================================
             ASSETS
        =========================================== -->

        <a-assets>


            <!-- ======================================
                 IMAGENS DOS PRODUTOS
            ======================================= -->

            <img
                id="imagem-leite"
                src="../../img/produtos/leite.png"
                alt="Leite">

            <img
                id="imagem-feijao"
                src="../../img/produtos/feijao.png"
                alt="Feijão">

            <img
                id="imagem-arroz"
                src="../../img/produtos/arroz.jpeg"
                alt="Arroz">

            <img
                id="imagem-macarrao"
                src="../../img/produtos/macarrao.jpeg"
                alt="Macarrão">

            <img
                id="imagem-oleo"
                src="../../img/produtos/oleo.jpeg"
                alt="Óleo">

            <img
                id="imagem-acucar"
                src="../../img/produtos/acucar.jpeg"
                alt="Açúcar">

            <img
                id="imagem-bombons"
                src="../../img/produtos/bombons.jpeg"
                alt="Bombons">

            <img
                id="imagem-giftcard"
                src="../../img/produtos/giftcard.png"
                alt="Gift Card">

            <img
                id="imagem-copo"
                src="../../img/produtos/copo.jpg"
                alt="Copo Térmico">

            <img
                id="imagem-boneco"
                src="../../img/produtos/boneco.jpeg"
                alt="Boneco">


            <!-- ======================================
                 MODELO 3D DOS PRODUTOS
            ======================================= -->
            <a-asset-item
                id="modelo-bombons"
                src="../../img/targets/bombons3D.glb">
            </a-asset-item>

            <a-asset-item
                id="modelo-acucar"
                src="../../img/targets/acucar3D.glb">
            </a-asset-item>

            <a-asset-item
                id="modelo-gojo"
                src="../../img/targets/gojo.glb">
        </a-asset-item>

        <a-asset-item
                id="modelo-leite"
                src="../../img/targets/leite3D.glb">
        </a-asset-item>

        <a-asset-item
                id="modelo-feijao"
                src="../../img/targets/feijao.glb">
        </a-asset-item>

         <a-asset-item
                id="modelo-copo"
                src="../../img/targets/copo3D.glb">
        </a-asset-item>

         <a-asset-item
                id="modelo-oleo"
                src="../../img/targets/oleo.glb">
        </a-asset-item>

        <a-asset-item
                id="modelo-giftcard"
                src="../../img/targets/giftcard.glb">
        </a-asset-item>

        <a-asset-item
                id="modelo-macarrao"
                src="../../img/targets/macarrao.glb">
        </a-asset-item>

        <a-asset-item
                id="modelo-arroz"
                src="../../img/targets/arroz.glb">
        </a-asset-item>

        </a-assets>
    
        <!-- ==========================================
             ILUMINAÇÃO PARA O MODELO 3D
        =========================================== -->

        <a-light
            type="ambient"
            intensity="2">
        </a-light>

        <a-light
            type="directional"
            intensity="3"
            position="2 4 2">
        </a-light>


        <!-- ==========================================
             CÂMERA
        =========================================== -->
<a-camera
    id="camera-ar"
    position="0 0 0"
    look-controls="enabled: false"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .produto-3d; far: 10000;">
</a-camera>

        <!-- ==========================================
             TARGET 0 - LEITE
        =========================================== -->

        <a-entity
            id="target-leite"
            mindar-image-target="targetIndex: 0"
            data-produto="leite">

          <!-- MODELO 3D DO LEITE -->

    <a-entity
        id="produto-leite"
        class="produto-3d"
        gltf-model="#modelo-leite"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        data-produto="leite">

    </a-entity>

        </a-entity>


        <!-- ==========================================
             TARGET 1 - FEIJÃO
        =========================================== -->

        <a-entity
            id="target-feijao"
            mindar-image-target="targetIndex: 1"
            data-produto="feijao">

  <a-entity

                id="produto-feijao"

                class="produto-3d"

                gltf-model="#modelo-feijao"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="feijao">

            </a-entity>
        </a-entity>


        <!-- ==========================================
             TARGET 2 - ARROZ
        =========================================== -->

        <a-entity
            id="target-arroz"
            mindar-image-target="targetIndex: 2"
            data-produto="arroz">

  <a-entity

                id="produto-arroz"

                class="produto-3d"

                gltf-model="#modelo-arroz"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="arroz">

            </a-entity>

        </a-entity>


        <!-- ==========================================
             TARGET 3 - MACARRÃO
        =========================================== -->

        <a-entity
            id="target-macarrao"
            mindar-image-target="targetIndex: 3"
            data-produto="macarrao">

          <a-entity
        id="produto-macarrao"
        class="produto-3d"
        gltf-model="#modelo-macarrao"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        data-produto="macarrao">

    </a-entity>

        </a-entity>


        <!-- ==========================================
             TARGET 4 - ÓLEO
        =========================================== -->

        <a-entity
            id="target-oleo"
            mindar-image-target="targetIndex: 4"
            data-produto="oleo">

            
  <a-entity

                id="produto-oleo"

                class="produto-3d"

                gltf-model="#modelo-oleo"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="oleo">

            </a-entity>

        </a-entity>


        <!-- ==========================================
             TARGET 5 - AÇÚCAR
        =========================================== -->

     <a-entity
    id="target-acucar"
    mindar-image-target="targetIndex: 5"
    data-produto="acucar">

    <!-- MODELO 3D DO AÇÚCAR -->

    <a-entity
        id="produto-acucar"
        class="produto-3d"
        gltf-model="#modelo-acucar"
        position="0 0 0.1"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        data-produto="acucar">

    </a-entity>

</a-entity>


        <!-- ==========================================
             TARGET 6 - BOMBONS
             AGORA É 3D
        =========================================== -->

        <a-entity
            id="target-bombons"
            mindar-image-target="targetIndex: 6"
            data-produto="bombons">


            <!-- MODELO 3D -->

            <a-entity

                id="produto-bombons"

                class="produto-3d"

                gltf-model="#modelo-bombons"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="bombons">

            </a-entity>


        </a-entity>


        <!-- ==========================================
             TARGET 7 - GIFT CARD
        =========================================== -->

        <a-entity
            id="target-giftcard"
            mindar-image-target="targetIndex: 7"
            data-produto="giftcard">

         <!-- MODELO 3D -->

            <a-entity

                id="produto-giftcard"

                class="produto-3d"

                gltf-model="#modelo-giftcard"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="giftcard">

            </a-entity>

        </a-entity>


        <!-- ==========================================
             TARGET 8 - COPO
        =========================================== -->

        <a-entity
            id="target-copo"
            mindar-image-target="targetIndex: 8"
            data-produto="copo">

          
            <a-entity

                id="produto-copo"

                class="produto-3d"

                gltf-model="#modelo-copo"

                position="0 0 0.1"

                rotation="0 0 0"

                scale="0.5 0.5 0.5"

                data-produto="copo">

            </a-entity>

        </a-entity>

        <!-- ==========================================
     TARGET 9 - BONECO / GOJO 3D
=========================================== -->

<a-entity
    id="target-boneco"
    mindar-image-target="targetIndex: 9"
    data-produto="boneco">


    <!-- MODELO 3D DO GOJO -->

    <a-entity

        id="produto-boneco"

        class="produto-3d"

        gltf-model="#modelo-gojo"

        position="0 0 0.1"

        rotation="0 0 0"

        scale="0.5 0.5 0.5"

        data-produto="boneco">

    </a-entity>


</a-entity>

   

    </a-scene>


    <!-- ==========================================
         TOPO
    =========================================== -->

    <header class="cabecalho">

        <div class="nome-jogo">

            ESTOQUE
            <br>
            ZERO

        </div>


        <div class="informacoes">


            <!-- SALDO -->

            <div class="saldo">

                <span>
                    Saldo
                </span>

                <strong id="saldo">
                    R$ 0,00
                </strong>

            </div>


            <!-- TEMPO -->

            <div class="tempo">

                <span>
                    ⏱
                </span>

                <strong id="tempo">
                    02:00
                </strong>

            </div>


        </div>

    </header>


    <!-- ==========================================
         ALERTA DE TEMPO
    =========================================== -->

    <div
        id="alerta-tempo"
        class="alerta-tempo">

        <div class="icone-alerta">
            ⚠️
        </div>

        <strong>
            Tempo acabando!
        </strong>

        <span>
            Corra! Faltam poucos segundos.
        </span>

    </div>


    <!-- ==========================================
         CARRINHO
    =========================================== -->

    <button
        id="botao-carrinho"
        class="botao-carrinho"
        type="button">

        <span class="icone-carrinho">
            🛒
        </span>

        <span>
            Compras
        </span>

        <span
            id="quantidade-carrinho"
            class="quantidade-carrinho">

            0

        </span>

    </button>


    <!-- ==========================================
         TROCAR CÂMERA
    =========================================== -->

    <button
        id="trocar-camera"
        class="botao-trocar-camera"
        type="button"
        aria-label="Trocar câmera">

        🔄

    </button>


    <!-- ==========================================
         ERRO
    =========================================== -->

    <div
        id="erro-camera"
        class="erro-camera">

        <h2>
            Câmera não disponível
        </h2>

        <p id="texto-erro">
            Não foi possível acessar a câmera.
        </p>

        <button
            id="tentar-novamente"
            type="button">

            Tentar novamente

        </button>

    </div>


</main>


<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script src="../../Js/camera.js"></script>

<script src="../../Js/cronometro.js"></script>


</body>

</html>
