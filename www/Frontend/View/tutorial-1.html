<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorial 1 - Estoque Zero</title>

    <link rel="stylesheet" href="../../CSS/tutorial-1.css">
</head>

<body>

    <main class="tela-tutorial">

        <!-- Cabeçalho -->
        <header class="cabecalho">

            <div class="logo">
                ESTOQUE <span>ZERO</span>
            </div>

            <div class="contador-tutorial">
                1/3
            </div>

        </header>


        <!-- Área principal -->
        <section class="conteudo">

            <!-- Ilustração -->
            <div class="area-ilustracao">

                <div class="circulo-ilustracao">

                    <div class="carteira">
                        💳
                    </div>

                    <div class="dinheiro dinheiro-1">
                        💵
                    </div>

                    <div class="dinheiro dinheiro-2">
                        💵
                    </div>

                </div>

            </div>


            <!-- Texto -->
            <div class="area-texto">

                <h1>
                    Seu dinheiro,<br>
                    suas escolhas!
                </h1>

                <p>
                    Você começa o desafio com
                    <strong>R$ 50,00</strong>.
                </p>

                <p class="texto-secundario">
                    Durante o jogo, você poderá escolher
                    produtos e decidir como gastar seu dinheiro.
                </p>

            </div>


            <!-- Valor inicial -->
            <div class="cartao-saldo">

                <span class="titulo-saldo">
                    Seu saldo inicial
                </span>

                <strong>
                    R$ 50,00
                </strong>

            </div>


            <!-- Botão -->
            <div class="area-botao">

                <button id="botao-proximo" class="botao-principal">
                    Próximo
                    <span>→</span>
                </button>

            </div>


            <!-- Indicadores -->
            <div class="indicadores">

                <span class="indicador ativo"></span>

                <span class="indicador"></span>

                <span class="indicador"></span>

            </div>

        </section>

    </main>


    <script src="../../Js/tutorial-1.js"></script>

</body>

</html>
