<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorial 2 - Estoque Zero</title>

    <link rel="stylesheet" href="../../CSS/tutorial-2.css">
</head>

<body>

    <main class="tela-tutorial">

        <!-- Cabeçalho -->
        <header class="cabecalho">

            <div class="logo">
                ESTOQUE <span>ZERO</span>
            </div>

            <div class="contador-tutorial">
                2/3
            </div>

        </header>


        <!-- Conteúdo -->
        <section class="conteudo">

            <!-- Ilustração -->
            <div class="area-ilustracao">

                <div class="circulo-ilustracao">

                    <div class="produto produto-1">
                        🍎
                    </div>

                    <div class="produto produto-2">
                        🍫
                    </div>

                    <div class="carrinho">
                        🛒
                    </div>

                </div>

            </div>


            <!-- Texto principal -->
            <div class="area-texto">

                <h1>
                    Escolha com<br>
                    cuidado!
                </h1>

                <p>
                    Cada produto possui um preço.
                </p>

                <p class="texto-secundario">
                    Antes de comprar, pense:
                    <strong>eu realmente preciso disso?</strong>
                </p>

            </div>


            <!-- Dica -->
            <div class="cartao-dica">

                <div class="icone-dica">
                    💡
                </div>

                <div class="texto-dica">

                    <span>Dica</span>

                    <p>
                        Tente equilibrar suas compras
                        para não gastar todo o seu dinheiro.
                    </p>

                </div>

            </div>


            <!-- Botão -->
            <div class="area-botao">

                <button id="botao-proximo" class="botao-principal">

                    Próximo

                    <span>→</span>

                </button>

            </div>


            <!-- Indicadores -->
            <div class="indicadores">

                <span class="indicador"></span>

                <span class="indicador ativo"></span>

                <span class="indicador"></span>

            </div>

        </section>

    </main>


    <script src="../../Js/tutorial-2.js"></script>

</body>

</html>
