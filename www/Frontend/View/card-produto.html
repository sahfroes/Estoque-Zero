<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover">

    <title>Produto encontrado</title>

    <link
        rel="stylesheet"
        href="../../CSS/card-produto.css">

</head>

<body>

    <main class="tela-camera">


        <!-- ==========================================
             CARD
        =========================================== -->

        <div class="card-produto">


            <!-- ======================================
                 FECHAR
            ======================================= -->

            <button
                type="button"
                class="fechar"
                id="fechar"
                aria-label="Fechar">

                ×

            </button>


            <!-- ======================================
                 IMAGEM
            ======================================= -->

            <div class="area-imagem">

                <img
                    id="imagemProduto"
                    src=""
                    alt="Produto encontrado">

            </div>


            <!-- ======================================
                 INFORMAÇÕES
            ======================================= -->

            <div class="informacoes">

                <h1 id="nomeProduto">
                    Produto
                </h1>

                <p id="precoProduto">
                    R$ 0,00
                </p>

            </div>


            <!-- ======================================
                 BOTÕES
            ======================================= -->

            <div class="botoes">

                <button
                    type="button"
                    class="botao-adicionar"
                    id="adicionar">

                    🛒 Adicionar ao carrinho

                </button>


                <button
                    type="button"
                    class="botao-cancelar"
                    id="cancelar">

                    Cancelar

                </button>

            </div>

        </div>

    </main>


    <script src="../../JS/card-produto.js"></script>

</body>

</html>
