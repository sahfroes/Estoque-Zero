<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutorial 3 - Estoque Zero</title>

    <link rel="stylesheet" href="../../CSS/tutorial-3.css">
</head>

<body>

    <main class="tela-tutorial">

        <!-- ========================================
             CABEÇALHO
        ========================================= -->

        <header class="cabecalho">

            <div class="logo">
                ESTOQUE <span>ZERO</span>
            </div>

            <div class="contador-tutorial">
                3/3
            </div>

        </header>


        <!-- ========================================
             CONTEÚDO
        ========================================= -->

        <section class="conteudo">


            <!-- ========================================
                 ILUSTRAÇÃO
            ========================================= -->

            <div class="area-ilustracao">

                <div class="circulo-ilustracao">

                    <!-- Relógio -->
                    <div class="relogio">
                        ⏱️
                    </div>

                    <!-- Moeda -->
                    <div class="moeda moeda-1">
                        🪙
                    </div>

                    <div class="moeda moeda-2">
                        🪙
                    </div>

                </div>

            </div>


            <!-- ========================================
                 TEXTO
            ========================================= -->

            <div class="area-texto">

                <h1>
                    O desafio<br>
                    começa agora!
                </h1>

                <p>
                    Você terá apenas
                    <strong>2 minutos</strong>
                    para fazer suas escolhas.
                </p>

                <p class="texto-secundario">
                    Seu objetivo é comprar o que quiser,
                    mas terminar o desafio com
                    <strong>dinheiro sobrando.</strong>
                </p>

            </div>


            <!-- ========================================
                 REGRAS
            ========================================= -->

            <div class="cartao-regras">

                <div class="regra">

                    <div class="icone-regra">
                        ⏱️
                    </div>

                    <div>
                        <strong>
                            2 minutos
                        </strong>

                        <span>
                            Controle o tempo
                        </span>
                    </div>

                </div>


                <div class="regra">

                    <div class="icone-regra">
                        💰
                    </div>

                    <div>
                        <strong>
                            R$ 50,00
                        </strong>

                        <span>
                            Cuide do seu saldo
                        </span>
                    </div>

                </div>


                <div class="regra">

                    <div class="icone-regra">
                        ⭐
                    </div>

                    <div>
                        <strong>
                            Pontuação
                        </strong>

                        <span>
                            Quanto melhor administrar, melhor!
                        </span>
                    </div>

                </div>

            </div>


            <!-- ========================================
                 BOTÃO
            ========================================= -->

            <div class="area-botao">

                <button id="botao-comecar" class="botao-principal">

                    Começar desafio

                    <span>→</span>

                </button>

            </div>


            <!-- ========================================
                 INDICADORES
            ========================================= -->

            <div class="indicadores">

                <span class="indicador"></span>

                <span class="indicador"></span>

                <span class="indicador ativo"></span>

            </div>

        </section>

    </main>


    <script src="../../Js/tutorial-3.js"></script>

</body>

</html>
