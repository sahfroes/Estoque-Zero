<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover,
                 maximum-scale=1.0,
                 user-scalable=no">

    <!-- ==========================================
         A-FRAME
    =========================================== -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- ==========================================
         A-FRAME EXTRAS
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <!-- ==========================================
         MINDAR
    =========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <title>Estoque Zero - Câmera</title>

    <link
        rel="stylesheet"
        href="../../CSS/camera.css">

</head>


<body>

<main class="tela-camera">


    <!-- ==========================================
         CENA AR
    =========================================== -->

    <a-scene

        id="cena-ra"

        class="cena-ra"

        mindar-image="
            imageTargetSrc: ../../img/targets/targets.mind;
            autoStart: true;
            uiScanning: no;
            uiLoading: no;
            filterMinCF: 0.0001;
            filterBeta: 0.001;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights: true;
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="
            enabled: false
        ">


        <!-- ==========================================
             IMAGENS DOS PRODUTOS
        =========================================== -->

        <a-assets>

            <img
                id="imagem-leite"
                src="../../img/produtos/leite.png"
                alt="Leite">

            <img
                id="imagem-feijao"
                src="../../img/produtos/feijao.png"
                alt="Feijão">

            <img
                id="imagem-arroz"
                src="../../img/produtos/arroz.png"
                alt="Arroz">

            <img
                id="imagem-macarrao"
                src="../../img/produtos/macarrao.png"
                alt="Macarrão">

            <img
                id="imagem-oleo"
                src="../../img/produtos/oleo.png"
                alt="Óleo">

            <img
                id="imagem-acucar"
                src="../../img/produtos/acucar.png"
                alt="Açúcar">

            <img
                id="imagem-bombons"
                src="../../img/produtos/bombons.png"
                alt="Bombons">

            <img
                id="imagem-giftcard"
                src="../../img/produtos/giftcard.png"
                alt="Gift Card">

            <img
                id="imagem-copo"
                src="../../img/produtos/copo.png"
                alt="Copo Térmico">

            <img
                id="imagem-boneco"
                src="../../img/produtos/boneco.png"
                alt="Boneco">

        </a-assets>


        <!-- ==========================================
             CÂMERA
        =========================================== -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

<!-- LEITE -->
<a-entity
    id="target-leite"
    mindar-image-target="targetIndex: 0"
    data-produto="leite">

    <a-image
        id="produto-leite"
        class="produto-ar"
        src="../../img/produtos/leite.png"
        position="0 0 0.1"
        width="0.8"
        height="1.1">
    </a-image>

</a-entity>

<!-- FEIJÃO -->
<a-entity
    id="target-feijao"
    mindar-image-target="targetIndex: 1"
    data-produto="feijao">

    <a-image
        id="produto-feijao"
        class="produto-ar"
        src="../../img/produtos/feijao.png"
        position="0 0 0.1"
        width="0.8"
        height="1.1">
    </a-image>

</a-entity>

<!-- ARROZ -->
<a-entity
    id="target-arroz"
    mindar-image-target="targetIndex: 2"
    data-produto="arroz">

    <a-image
        id="produto-arroz"
        class="produto-ar"
        src="../../img/produtos/arroz.jpeg"
        position="0 0 0.1"
        width="0.8"
        height="1.1">
    </a-image>

</a-entity>

<!-- MACARRÃO -->
<a-entity
    id="target-macarrao"
    mindar-image-target="targetIndex: 3"
    data-produto="macarrao">

    <a-image
        id="produto-macarrao"
        class="produto-ar"
        src="../../img/produtos/macarrao.jpeg"
        position="0 0 0.1"
        width="0.8"
        height="1.1">
    </a-image>

</a-entity>

<!-- ==========================================
     TARGET 4 - ÓLEO
=========================================== -->
<a-entity
    id="target-oleo"
    mindar-image-target="targetIndex: 4"
    data-produto="oleo">

 <a-image
    id="produto-oleo"
    class="produto-ar"
    src="../../img/produtos/oleo.jpeg"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>

<!-- ==========================================
     TARGET 5 - AÇÚCAR
=========================================== -->

<a-entity
    id="target-acucar"
    mindar-image-target="targetIndex: 5"
    data-produto="acucar">

<a-image
    id="produto-acucar"
    class="produto-ar"
    src="../../img/produtos/acucar.jpeg"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>

<!-- ==========================================
     TARGET 6 - BOMBONS
=========================================== -->

<a-entity
    id="target-bombons"
    mindar-image-target="targetIndex: 6"
    data-produto="bombons">

    <a-image
    id="produto-bombons"
    class="produto-ar"
    src="../../img/produtos/bombons.jpeg"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>


<!-- ==========================================
     TARGET 7 - GIFT CARD
=========================================== -->

<a-entity
    id="target-giftcard"
    mindar-image-target="targetIndex: 7"
    data-produto="giftcard">

<a-image
    id="produto-giftcard"
    class="produto-ar"
    src="../../img/produtos/giftcard.png"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>


<!-- ==========================================
     TARGET 8 - COPO
=========================================== -->
<a-entity
    id="target-copo"
    mindar-image-target="targetIndex: 8"
    data-produto="copo">

<a-image
    id="produto-copo"
    class="produto-ar"
    src="../../img/produtos/copo.jpg"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>

<!-- ==========================================
     TARGET 9 - BONECO
=========================================== -->

<a-entity
    id="target-boneco"
    mindar-image-target="targetIndex: 9"
    data-produto="boneco">

    <a-image
    id="produto-copo"
    class="produto-ar"
    src="../../img/produtos/boneco.jpeg"
    position="0 0 0.1"
    width="0.8"
    height="1.1">
</a-image>

</a-entity>
   


    <!-- ==========================================
         MENSAGEM DA CÂMERA
    =========================================== -->

    <div
        id="mensagem-camera"
        class="mensagem-camera">

        <div class="icone-camera">
            📷
        </div>

        <p>
            Preparando sua câmera...
        </p>

    </div>


    <!-- ==========================================
         TOPO
    =========================================== -->

    <header class="cabecalho">

        <div class="nome-jogo">

            ESTOQUE<br>
            ZERO

        </div>


        <div class="informacoes">

            <div class="saldo">

                Saldo

                <strong id="saldo">
                    R$ 0,00
                </strong>

            </div>


            <div class="tempo">

                <span>
                    ⏱
                </span>

                <strong id="tempo">
                    02:00
                </strong>

            </div>

        </div>

    </header>


    <!-- ==========================================
         ALERTA DE TEMPO
    =========================================== -->

    <div
        id="alerta-tempo"
        class="alerta-tempo">

        <div class="icone-alerta">
            ⚠️
        </div>

        <strong>
            Tempo acabando!
        </strong>

        <span>
            Corra! Faltam poucos segundos.
        </span>

    </div>


    <!-- ==========================================
         CARRINHO
    =========================================== -->

    <button
        id="botao-carrinho"
        class="botao-carrinho"
        type="button">

        <span class="icone-carrinho">
            🛒
        </span>

        <span>
            Compras
        </span>

        <span
            id="quantidade-carrinho"
            class="quantidade-carrinho">
            0
        </span>

    </button>


    <!-- ==========================================
         TROCAR CÂMERA
    =========================================== -->

    <button
        id="trocar-camera"
        class="botao-trocar-camera"
        type="button"
        aria-label="Trocar câmera">

        🔄

    </button>


    <!-- ==========================================
         ERRO
    =========================================== -->

    <div
        id="erro-camera"
        class="erro-camera">

        <h2>
            Câmera não disponível
        </h2>

        <p id="texto-erro">
            Não foi possível acessar a câmera.
        </p>

        <button
            id="tentar-novamente"
            type="button">

            Tentar novamente

        </button>

    </div>


</main>


<script src="../../Js/camera.js"></script>

</body>

</html>
