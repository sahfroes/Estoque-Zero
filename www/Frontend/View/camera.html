
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <!-- Faz a página se adaptar ao celular -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Estoque Zero - Câmera</title>

    <!-- CSS da tela -->
    <link
        rel="stylesheet"
        href="../../CSS/camera.css"
    >

</head>

<body>

    <main class="aplicativo">
      <!-- =========================
             TOPO
        ========================== -->

        <header class="topo">

            <div class="logo">

                ESTOQUE
                <span>ZERO</span>

            </div>

            <div class="saldo">

                <small>Saldo</small>

                <strong id="saldo">
                    R$ 50,00
                </strong>

            </div>

            <div class="tempo">

                <span>⏱</span>

                <strong id="tempo">
                    02:00
                </strong>

            </div>

        </header>

        <!-- =========================
             ÁREA DA CÂMERA
        ========================== -->

        <section class="area-camera">

            <!--
                Vídeo que vai mostrar
                a câmera do celular
            -->

            <video
                id="camera"
                autoplay
                muted
                playsinline>
            </video>

            <!-- Escurece levemente a câmera -->

            <div class="escurecimento"></div>


            <!-- Moldura -->

            <div class="moldura">

                <span class="canto canto-superior-esquerdo"></span>

                <span class="canto canto-superior-direito"></span>

                <span class="canto canto-inferior-esquerdo"></span>

                <span class="canto canto-inferior-direito"></span>

                <p>
                    Aponte para um produto
                </p>


                <small>
                    Coloque o QR Code dentro da moldura
                </small>

            </div>


            <!-- Mensagem -->

            <div class="mensagem-camera">

                💡 Encontre produtos e faça boas escolhas!

            </div>

            
            <!-- Botão para abrir a câmera -->

            <button
                id="botaoCamera"
                class="botao-camera">

                📷 Abrir câmera

            </button>

        </section>

        <!-- =========================
             PRODUTO ENCONTRADO
        ========================== -->

        <section
            id="produtoEncontrado"
            class="produto-modal escondido"
        >

            <button
                id="fecharProduto"
                class="fechar"
            >
                ×
            </button>


            <div
                id="produtoImagem"
                class="produto-imagem"
            >
                🥛
            </div>


            <h2 id="produtoNome">
                Leite integral
            </h2>


            <div
                id="produtoPreco"
                class="preco"
            >
                R$ 7,50
            </div>


            <div
                id="produtoCategoria"
                class="categoria"
            >
                Alimentação
            </div>


            <button
                id="comprarBtn"
                class="botao-principal"
            >

                🛒 Comprar produto

            </button>


            <button
                id="cancelarBtn"
                class="botao-secundario"
            >

                Cancelar

            </button>

        </section>

        <!-- =========================
             AVISO
        ========================== -->

        <div
            id="aviso"
            class="aviso escondido"
        ></div>

        <!-- =========================
             MENU
        ========================== -->

        <nav class="menu">

            <button class="item-menu ativo">

                <span>🛒</span>

                Compras

            </button>

        </nav>

        <!-- Canvas utilizado para
             ler o QR Code -->

        <canvas
            id="canvasQR"
            hidden>
        </canvas>

    </main>

    <!-- Biblioteca para ler QR Code -->

    <script
        src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
    </script>


    <!-- JavaScript da tela -->

    <script src="../../JS/camera.js"></script>


</body>

</html>
