<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar ao celular -->
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Estoque Zero - Câmera</title>

    <link rel="stylesheet" href="../../CSS/camera.css">
</head>

<body>

    <!-- ==========================================
         ÁREA DA CÂMERA
    =========================================== -->

    <main class="tela-camera">

        <!-- Vídeo da câmera do celular -->
        <video
            id="camera"
            autoplay
            muted
            playsinline>
        </video>


        <!-- Mensagem enquanto a câmera carrega -->
        <div id="mensagem-camera" class="mensagem-camera">

            <div class="icone-camera">
                📷
            </div>

            <p>
                Preparando sua câmera...
            </p>

        </div>


        <!-- ==========================================
             TOPO
        =========================================== -->

        <header class="cabecalho">

            <div class="nome-jogo">
                ESTOQUE<br>
                ZERO
            </div>

            <div class="informacoes">

                <div class="saldo">
                    Saldo
                    <strong id="saldo">
                        R$ 0,00
                    </strong>
                </div>

                <div class="tempo">

                    <span>⏱</span>

                    <strong id="tempo">
                        02:00
                    </strong>

                </div>

            </div>

        </header>


        <!-- ==========================================
             ÁREA DE ESCANEAMENTO
        =========================================== -->

        <section class="area-escaneamento">

            <div class="moldura">

                <span class="canto canto-superior-esquerdo"></span>
                <span class="canto canto-superior-direito"></span>

                <span class="canto canto-inferior-esquerdo"></span>
                <span class="canto canto-inferior-direito"></span>

            </div>


            <p class="instrucao">
                Aponte para um produto
            </p>

        </section>

<!-- ALERTA DE TEMPO -->
<div id="alerta-tempo" class="alerta-tempo">
    <div class="icone-alerta">⚠️</div>

    <strong>Tempo acabando!</strong>

    <span>Corra! Faltam poucos segundos.</span>
</div>


        <!-- ==========================================
             BOTÃO DO CARRINHO
        =========================================== -->

        <button
            id="botao-carrinho"
            class="botao-carrinho"
            type="button">

            <span class="icone-carrinho">
                🛒
            </span>

            <span>
                Compras
            </span>

            <span
                id="quantidade-carrinho"
                class="quantidade-carrinho">
                0
            </span>

        </button>


        <!-- ==========================================
             BOTÃO TROCAR CÂMERA
        =========================================== -->

        <button
            id="trocar-camera"
            class="botao-trocar-camera"
            type="button"
            aria-label="Trocar câmera">

            🔄

        </button>

        <!-- ==========================================
             MENSAGEM DE ERRO
        =========================================== -->

        <div
            id="erro-camera"
            class="erro-camera">

            <h2>
                Câmera não disponível
            </h2>

            <p id="texto-erro">
                Não foi possível acessar a câmera.
            </p>

            <button
                id="tentar-novamente"
                type="button">

                Tentar novamente

            </button>

        </div>

    </main>


    <script src="../../Js/camera.js"></script>

</body>

</html>
